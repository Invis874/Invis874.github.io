<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flowers</title>
        <link rel="icon" href="assets/icons/sunflower.svg" type="image/svg+xml">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="main-content">
            <div class="rose-wrapper">
                <div class="rose">
                    <div class="rose-bud">
                        <div class="petal-1"></div>
                        <div class="petal-2"></div>
                        <div class="petal-3"></div>
                    </div>
                    <div class="rose-stem"></div>
                </div>

                <div class="message">
                    🌹 Эта роза тебе 🌹
                    <small>— решил вопрос с цветами</small>
                </div>
            </div>
        </div>

        <div class="bouquet">
            <div class="sunflower sunflower-1">
                <div class="sunflower-head"></div>
                <div class="sunflower-stem"></div>
            </div>
            <div class="sunflower sunflower-2">
                <div class="sunflower-head"></div>
                <div class="sunflower-stem"></div>
            </div>
            <div class="sunflower sunflower-3">
                <div class="sunflower-head"></div>
                <div class="sunflower-stem"></div>
            </div>
            <div class="sunflower sunflower-4">
                <div class="sunflower-head"></div>
                <div class="sunflower-stem"></div>
            </div>
            <div class="sunflower sunflower-5">
                <div class="sunflower-head"></div>
                <div class="sunflower-stem"></div>
            </div>

            <div class="ribbon"></div>
            <div class="ribbon-bow">🎀</div>
        </div>
    </body>
</html>
