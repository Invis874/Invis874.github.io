<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Цветы для тебя 🌹</title>
    <style>
        /* --- Сброс и глобальные стили --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fdf6f0 0%, #f0e6d8 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px 15px;
            overflow-x: hidden;
        }

        /* --- Основной контент: роза и текст --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 10px 0 20px;
        }

        .rose-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ===== РОЗА (CSS) ===== */
        .rose {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            /* центрирование */;
        }

        /* Бутон розы — спираль из лепестков */
        .rose-bud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4d6d, #b3002d);
            box-shadow: 0 10px 25px rgba(180, 0, 30, 0.4);
            z-index: 10;
            /* лепестки-спираль через before/after и box-shadow */
        }

        .rose-bud::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 70%;
            height: 70%;
            border-radius: 50% 50% 50% 0;
            background: radial-gradient(circle at 70% 30%, #ff6b8a, #cc0033);
            transform: rotate(-20deg);
            box-shadow: -5px -5px 15px rgba(200, 0, 50, 0.3);
            z-index: 2;
        }

        .rose-bud::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: -5%;
            width: 65%;
            height: 65%;
            border-radius: 50% 0 50% 50%;
            background: radial-gradient(circle at 30% 70%, #ff597b, #a6002a);
            transform: rotate(30deg);
            box-shadow: 5px 5px 15px rgba(150, 0, 30, 0.3);
            z-index: 1;
        }

        /* Дополнительные лепестки через box-shadow на псевдоэлементах (эффект спирали) */
        .rose-bud .petal-1,
        .rose-bud .petal-2,
        .rose-bud .petal-3 {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #ff7a9a, #d9003a);
            box-shadow: 0 4px 10px rgba(200, 0, 50, 0.2);
            opacity: 0.8;
        }

        .rose-bud .petal-1 {
            width: 55px;
            height: 55px;
            top: 5%;
            left: 25%;
            transform: rotate(15deg);
            background: radial-gradient(circle at 60% 30%, #ff8aad, #cc0033);
            z-index: 3;
        }

        .rose-bud .petal-2 {
            width: 50px;
            height: 50px;
            bottom: 8%;
            right: 15%;
            transform: rotate(-25deg);
            background: radial-gradient(circle at 30% 70%, #ff6b8a, #b8002d);
            z-index: 3;
        }

        .rose-bud .petal-3 {
            width: 45px;
            height: 45px;
            top: 40%;
            left: 5%;
            transform: rotate(45deg);
            background: radial-gradient(circle at 60% 60%, #ff597b, #a6002a);
            z-index: 3;
        }

        /* Стебель розы */
        .rose-stem {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 70px;
            background: linear-gradient(to bottom, #2d6a2d, #1e4d1e);
            border-radius: 3px;
            z-index: 5;
            box-shadow: 0 0 8px rgba(30, 80, 30, 0.3);
        }

        /* Листья на стебле */
        .rose-stem::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 30px;
            width: 20px;
            height: 10px;
            background: #2e7d32;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-30deg);
            box-shadow: 0 0 6px rgba(40, 100, 40, 0.4);
        }

        .rose-stem::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 45px;
            width: 22px;
            height: 10px;
            background: #388e3c;
            border-radius: 0 50% 50% 50%;
            transform: rotate(30deg);
            box-shadow: 0 0 6px rgba(40, 100, 40, 0.4);
        }

        /* Текст под розой */
        .message {
            font-size: 1.4rem;
            color: #4a2c1a;
            text-align: center;
            line-height: 1.6;
            margin: 10px 0 5px;
            padding: 0 10px;
            background: rgba(255, 245, 235, 0.5);
            border-radius: 30px;
            padding: 8px 20px;
            backdrop-filter: blur(3px);
            box-shadow: 0 2px 10px rgba(100, 60, 30, 0.1);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .message small {
            display: block;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
            font-style: italic;
        }

        /* ===== ПОДВАЛ с 5 ПОДСОЛНУХАМИ ===== */
        footer {
            width: 100%;
            max-width: 700px;
            padding: 15px 5px 5px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            background: rgba(240, 230, 215, 0.4);
            border-radius: 60px 60px 20px 20px;
            backdrop-filter: blur(4px);
            margin-top: 10px;
            border-top: 2px solid rgba(180, 140, 100, 0.2);
        }

        /* ----- ОДИН ПОДСОЛНУХ (CSS) ----- */
        .sunflower {
            position: relative;
            width: 60px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            margin: 0 2px;
        }

        /* Головка подсолнуха */
        .sunflower-head {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #f5c542, #d49a1a);
            box-shadow: 0 4px 12px rgba(180, 120, 20, 0.4);
            z-index: 2;
            flex-shrink: 0;
        }

        /* Сердцевина (семечки) */
        .sunflower-head::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle, #4a3a2a, #2d2418);
            box-shadow: inset 0 0 8px #1a140e;
            z-index: 3;
        }

        /* Лепестки подсолнуха — рисуем через box-shadow на псевдоэлементе */
        .sunflower-head::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: transparent;
            box-shadow:
                /* Внешние лепестки (12 штук) */
                0 -28px 0 -2px #f5c542,
                0 28px 0 -2px #f5c542,
                28px 0 0 -2px #f5c542,
                -28px 0 0 -2px #f5c542,
                20px -20px 0 -2px #f5c542,
                -20px 20px 0 -2px #f5c542,
                20px 20px 0 -2px #f5c542,
                -20px -20px 0 -2px #f5c542,
                26px -10px 0 -2px #f5c542,
                -26px 10px 0 -2px #f5c542,
                26px 10px 0 -2px #f5c542,
                -26px -10px 0 -2px #f5c542,
                10px -26px 0 -2px #f5c542,
                -10px 26px 0 -2px #f5c542,
                10px 26px 0 -2px #f5c542,
                -10px -26px 0 -2px #f5c542;
            z-index: 1;
        }

        /* Стебель подсолнуха */
        .sunflower-stem {
            width: 4px;
            height: 30px;
            background: linear-gradient(to top, #2d6a2d, #4a8a3a);
            border-radius: 2px;
            margin-top: -2px;
            z-index: 0;
            flex-shrink: 0;
            position: relative;
        }

        /* Листочек на стебле (маленький) */
        .sunflower-stem::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 6px;
            background: #3d7a3d;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-20deg);
        }

        /* Адаптивность для телефонов */
        @media (max-width: 480px) {
            .rose {
                width: 140px;
                height: 140px;
            }

            .rose-bud {
                width: 80px;
                height: 80px;
            }

            .rose-bud .petal-1 {
                width: 40px;
                height: 40px;
            }
            .rose-bud .petal-2 {
                width: 38px;
                height: 38px;
            }
            .rose-bud .petal-3 {
                width: 34px;
                height: 34px;
            }

            .rose-stem {
                height: 50px;
                bottom: -30px;
            }

            .message {
                font-size: 1.1rem;
                padding: 6px 14px;
            }

            .sunflower {
                width: 50px;
                height: 68px;
            }

            .sunflower-head {
                width: 42px;
                height: 42px;
            }

            .sunflower-head::before {
                width: 20px;
                height: 20px;
            }

            .sunflower-head::after {
                width: 36px;
                height: 36px;
                box-shadow:
                    0 -22px 0 -2px #f5c542,
                    0 22px 0 -2px #f5c542,
                    22px 0 0 -2px #f5c542,
                    -22px 0 0 -2px #f5c542,
                    16px -16px 0 -2px #f5c542,
                    -16px 16px 0 -2px #f5c542,
                    16px 16px 0 -2px #f5c542,
                    -16px -16px 0 -2px #f5c542,
                    20px -8px 0 -2px #f5c542,
                    -20px 8px 0 -2px #f5c542,
                    20px 8px 0 -2px #f5c542,
                    -20px -8px 0 -2px #f5c542,
                    8px -20px 0 -2px #f5c542,
                    -8px 20px 0 -2px #f5c542,
                    8px 20px 0 -2px #f5c542,
                    -8px -20px 0 -2px #f5c542;
            }

            .sunflower-stem {
                height: 24px;
            }

            footer {
                gap: 4px 6px;
                padding: 10px 4px 4px;
                border-radius: 40px 40px 16px 16px;
            }
        }

        @media (max-width: 380px) {
            .sunflower {
                width: 40px;
                height: 56px;
            }
            .sunflower-head {
                width: 34px;
                height: 34px;
            }
            .sunflower-head::before {
                width: 16px;
                height: 16px;
            }
            .sunflower-head::after {
                width: 30px;
                height: 30px;
                box-shadow:
                    0 -18px 0 -1px #f5c542,
                    0 18px 0 -1px #f5c542,
                    18px 0 0 -1px #f5c542,
                    -18px 0 0 -1px #f5c542,
                    13px -13px 0 -1px #f5c542,
                    -13px 13px 0 -1px #f5c542,
                    13px 13px 0 -1px #f5c542,
                    -13px -13px 0 -1px #f5c542,
                    16px -6px 0 -1px #f5c542,
                    -16px 6px 0 -1px #f5c542,
                    16px 6px 0 -1px #f5c542,
                    -16px -6px 0 -1px #f5c542,
                    6px -16px 0 -1px #f5c542,
                    -6px 16px 0 -1px #f5c542,
                    6px 16px 0 -1px #f5c542,
                    -6px -16px 0 -1px #f5c542;
            }
            .sunflower-stem {
                height: 18px;
            }
            .message {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- Основной блок: роза -->
    <div class="main-content">
        <div class="rose-wrapper">
            <div class="rose">
                <!-- Бутон розы -->
                <div class="rose-bud">
                    <div class="petal-1"></div>
                    <div class="petal-2"></div>
                    <div class="petal-3"></div>
                </div>
                <!-- Стебель с листьями -->
                <div class="rose-stem"></div>
            </div>

            <div class="message">
                🌹 Для тебя, с любовью 🌹
                <small>— одна роза в знак нежности</small>
            </div>
        </div>
    </div>

    <!-- Подвал: 5 подсолнухов -->
    <footer>
        <!-- 1 -->
        <div class="sunflower">
            <div class="sunflower-head"></div>
            <div class="sunflower-stem"></div>
        </div>
        <!-- 2 -->
        <div class="sunflower">
            <div class="sunflower-head"></div>
            <div class="sunflower-stem"></div>
        </div>
        <!-- 3 -->
        <div class="sunflower">
            <div class="sunflower-head"></div>
            <div class="sunflower-stem"></div>
        </div>
        <!-- 4 -->
        <div class="sunflower">
            <div class="sunflower-head"></div>
            <div class="sunflower-stem"></div>
        </div>
        <!-- 5 -->
        <div class="sunflower">
            <div class="sunflower-head"></div>
            <div class="sunflower-stem"></div>
        </div>
    </footer>

</body>
</html>
