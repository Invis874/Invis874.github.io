<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 2px #fff inset;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            color: #d43f62;
            text-shadow: 2px 2px 0 #ffe0e5;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a6344f;
            font-size: 1.2rem;
            margin-bottom: 30px;
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: 15px;
        }

        /* Конверт */
        .envelope-wrapper {
            display: flex;
            justify-content: center;
            margin: 30px 0 20px;
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 200px;
            background: #f9a8b8;
            border: 2px solid #d46b7a;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px; /* Небольшой отступ сверху */
        }
        
        /* Клапан в ЗАКРЫТОМ состоянии (вершиной ВНИЗ, внутри конверта) */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0; /* Прилегает к верхнему краю */
            left: -2px;
            width: 100%;
            height: 50px; /* Высота клапана */
            background: #fbc1cb;
            border: 2px solid #d46b7a;
            border-top: none; /* Нет границы сверху — это сгиб */
            border-bottom: 2px solid #d46b7a;
            border-radius: 0 0 20px 20px; /* Скругление только снизу */
            
            /* Треугольник вершиной ВНИЗ */
            clip-path: polygon(0% 0%, 50% 100%, 100% 0%);
            
            box-sizing: content-box;
            z-index: 5;
        }
        
        /* Сердечко на конверте */
        .heart-on-envelope {
            position: absolute;
            top: 25px; /* Чуть ниже верхнего края */
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            line-height: 1;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
            animation: heartbeat 1.2s infinite;
        }
        
        /* ===== ОТКРЫТЫЙ КОНВЕРТ (добавляется класс .open) ===== */
        .envelope.open::before {
            /* Клапан поднимается вверх и переворачивается вершиной ВВЕРХ */
            top: -50px; /* Уходит вверх */
            border-top: 2px solid #d46b7a; /* Появляется верхняя граница */
            border-bottom: none;
            border-radius: 20px 20px 0 0; /* Скругление сверху */
            
            /* Треугольник вершиной ВВЕРХ */
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
            
            transition: all 0.5s ease;
        }
        
        /* Убираем линию сгиба при открытии */
        .envelope.open::after {
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        /* Сердечко может чуть подскочить при открытии */
        .envelope.open .heart-on-envelope {
            top: 15px;
            transition: top 0.5s;
        }
        
        @keyframes heartbeat {
            0% { transform: translateX(-50%) scale(1); }
            30% { transform: translateX(-50%) scale(1.2); }
            50% { transform: translateX(-50%) scale(1.3); }
            70% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .letter {
            background: #fff5f7;
            border-radius: 25px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid white;
            transform: translateY(0);
            opacity: 1;
            transition: all 0.5s ease-in-out;
        }

        .letter.closed {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            display: none; /* Скрываем, когда конверт не открыт */
        }

        .letter h2 {
            color: #c94f6a;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .message {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #4a2c2f;
            margin: 20px 0;
            font-style: italic;
        }

        .big-heart {
            font-size: 5rem;
            margin: 15px 0;
            filter: drop-shadow(0 4px 2px #ffa5b4);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .footer-note {
            color: #b34e6b;
            margin-top: 20px;
            font-size: 1rem;
        }

        .hint {
            background: rgba(255,255,240,0.5);
            border-radius: 30px;
            padding: 8px 20px;
            display: inline-block;
            color: #a1344f;
            font-weight: bold;
            margin: 15px 0 5px;
            backdrop-filter: blur(2px);
        }

        /* Кнопка сброса (по желанию) */
        .reset-btn {
            background: none;
            border: 2px solid #ffa5b4;
            color: #d43f62;
            padding: 8px 25px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #ffa5b4;
            color: white;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>💖 С Днём Святого Валентина! 💖</h1>
    <div class="subtitle">для самой особенной девочки</div>

    <!-- Конверт с подсказкой -->
    <div class="envelope-wrapper">
        <div class="envelope" id="envelope">
            <div class="heart-on-envelope">❤️</div>
        </div>
    </div>
    <div class="hint" id="hint">👆 Нажми на конверт!</div>

    <!-- Письмо (изначально скрыто) -->
    <div class="letter closed" id="letter">
        <h2>Милый ангел!</h2>
        <div class="message">
            Ты как солнце в хмурый день, <br>
            Как весенний первый луч. <br>
            Разгоняешь ты мгновенно <br>
            Тучи серые из туч. ✨
        </div>
        <div class="big-heart">❤️</div>
        <div class="message" style="font-size: 1.5rem;">
            С 14 Февраля!
        </div>
        <div class="footer-note">
            Твой маленький сюрприз 🤍
        </div>
    </div>

    <!-- Кнопка, чтобы спрятать обратно (опционально) -->
    <button class="reset-btn" id="resetBtn" style="display: none;" onclick="resetEnvelope()">💌 Спрятать письмо</button>
</div>

<script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');
    const hint = document.getElementById('hint');
    const resetBtn = document.getElementById('resetBtn');

    // Проверяем, открыто ли уже письмо (например, после перезагрузки показываем закрытым)
    // Устанавливаем начальное состояние
    letter.classList.add('closed');
    resetBtn.style.display = 'none';

    // Функция открытия
    function openValentine() {
        letter.classList.remove('closed'); // Показываем письмо
        hint.style.opacity = '0.5';
        hint.textContent = '❤️ Открыто ❤️';
        resetBtn.style.display = 'inline-block'; // Показываем кнопку сброса

        envelope.classList.add('open');
        
        // Небольшая анимация конверта (исчезает визуально, но можно оставить)
        envelope.style.opacity = '0.7';
        envelope.style.pointerEvents = 'none'; // Запрещаем повторный клик
    }

    function openEnvelope() {
        const envelope = document.getElementById('envelope');
        envelope.classList.add('open');
    }

    // Функция сброса (закрыть письмо обратно)
    window.resetEnvelope = function() {
        letter.classList.add('closed'); // Скрываем письмо
        hint.style.opacity = '1';
        hint.textContent = '👆 Нажми на конверт!';
        resetBtn.style.display = 'none';
        envelope.style.opacity = '1';
        envelope.style.pointerEvents = 'auto'; // Возвращаем возможность клика
    }

    // Назначаем обработчик на конверт
    envelope.addEventListener('click', openValentine);

    // Если вдруг захочется открыть конверт и при нажатии на hint
    hint.addEventListener('click', openValentine);

    // Маленькая дополнительная анимация сердечка при загрузке (необязательно)
    window.onload = function() {
        console.log('Страница загружена, ждём нажатия!');
    };
</script>

<!-- Дополнительный декор: падающие сердечки (просто для красоты) -->
<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;">
    <div style="position: absolute; top: 10%; left: 5%; font-size: 30px; opacity: 0.3;">❤️</div>
    <div style="position: absolute; top: 40%; left: 90%; font-size: 50px; opacity: 0.2;">❤️</div>
    <div style="position: absolute; top: 70%; left: 15%; font-size: 40px; opacity: 0.2;">❤️</div>
    <div style="position: absolute; top: 20%; left: 80%; font-size: 60px; opacity: 0.1;">❤️</div>
</div>

</body>
</html>
